<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Розклад · ПФК НЮУ</title>
  <meta name="description" content="Розклад, заміни, таймер пар і графік відпрацювань для всіх груп і викладачів Полтавського фахового коледжу НЮУ">
  <meta name="theme-color" content="#3E3577" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15132A" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Розклад">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preload" href="fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <script>try{var t=new URLSearchParams(location.search).get("theme")||localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img class="logo-img" src="logo.png" width="46" height="46" alt="" fetchpriority="high">
        <div class="brand-text">
          <h1 class="brand-h1"><button type="button" class="brand-btn" id="brand-btn" aria-label="Змінити групу або викладача"><span id="title">Розклад</span></button></h1>
          <p class="sub" id="subtitle">завантаження…</p>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="theme-btn" aria-label="Перемкнути тему оформлення">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a class="icon-btn" id="ics" href="#" download aria-label="Додати розклад у календар (.ics)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18M12 14v5M9.5 16.5h5"/></svg>
        </a>
      </div>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>
    <div id="sr-status" class="sr-only" aria-live="polite"></div>

    <main id="view" tabindex="-1"></main>

    <footer class="foot">
      <span id="checked"></span><br>
      Сервіс погоджено з адміністрацією ПФК НЮУ. Джерело — PDF на <a id="src" href="#" target="_blank" rel="noopener">nlu.edu.ua</a>; при розбіжностях пріоритет за оголошеннями коледжу.
    </footer>
  </div>

  <nav class="tabbar" role="tablist" aria-label="Розділи">
    <button type="button" role="tab" aria-selected="true" data-tab="today" aria-label="Сьогодні і завтра"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Сьогодні</span></button>
    <button type="button" role="tab" aria-selected="false" tabindex="-1" data-tab="week" aria-label="Розклад на тиждень"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Тиждень</span></button>
    <button type="button" role="tab" aria-selected="false" tabindex="-1" data-tab="consult" aria-label="Відпрацювання та консультації"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Відпрац.</span></button>
    <button type="button" role="tab" aria-selected="false" tabindex="-1" data-tab="changes" aria-label="Заміни до розкладу"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></svg><span>Заміни</span><i class="dot" id="changes-dot" hidden></i></button>
    <button type="button" role="tab" aria-selected="false" tabindex="-1" data-tab="more" aria-label="Налаштування та посилання"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>Ще</span></button>
  </nav>

  <script src="app.js?v=11"></script>
</body>
</html>
