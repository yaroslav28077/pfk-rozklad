name: Розклад ПФК

# Щогодини (05:20–21:20 за Києвом взимку, 06:20–22:20 влітку) бот сам вирішує, що робити:
# перевіряє сайт коледжу, розбирає нові PDF, оновлює сайт і розсилає ранок/вечір/заміни.
on:
  schedule:
    - cron: "20 3-19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto — як за розкладом; morning/evening/weekly — примусова розсилка; none — лише оновити сайт"
        type: choice
        options: [auto, morning, evening, weekly, none]
        default: auto
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "docs/**"
      - "config.json"
      - ".github/workflows/rozklad.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: rozklad
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.bot.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Встановити залежності
        run: pip install -r scripts/requirements.txt

      - name: Оновити розклад, сайт і розіслати
        id: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          case "$EVENT" in
            push) MODE=none ;;
            schedule) MODE=auto ;;
            *) MODE="${INPUT_MODE:-auto}" ;;
          esac
          export SITE_URL="https://${OWNER,,}.github.io/${REPO_NAME}/"
          echo "Режим: $MODE · сайт: $SITE_URL"
          python scripts/bot.py run --mode "$MODE"

      - name: Зберегти розібрані PDF (data/)
        if: always() && steps.bot.outcome != 'skipped'
        run: |
          [ -d data ] || { echo "Немає data/"; exit 0; }
          git config user.name "rozklad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -m "auto: оновлення розкладу $(TZ=Europe/Kyiv date +'%d.%m %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Повтор $i…"; sleep 5
          done
          exit 1

      - uses: actions/configure-pages@v5
        if: steps.bot.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.bot.outputs.deploy == 'true'
        with:
          path: docs

      # GitHub вимикає cron-workflow після 60 днів без комітів — вмикаємо його знову щоразу
      - name: Не дати GitHub вимкнути розклад
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPO/actions/workflows/rozklad.yml/enable"

  pages:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
