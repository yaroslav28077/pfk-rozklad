name: Розклад ПФК

on:
  schedule:
    - cron: "15 4 * * 1-5"       # ≈06:15 за Києвом (зимовий час; влітку ≈07:15) — пари на сьогодні
    - cron: "0 16 * * 0-4"       # ≈18:00 за Києвом — пари на завтра
    - cron: "40 7,10,13 * * 1-5" # удень — лише нові заміни / новий розклад
  workflow_dispatch:
    inputs:
      mode:
        description: "morning = сьогодні, evening = завтра, watch = лише новини"
        required: false
        default: "morning"
  push:
    branches: [main]
    paths: ["data/rozklad.json", "config.json", "docs/**", "scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rozklad
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Встановити залежності
        run: pip install "pymupdf>=1.24"
      - name: Перевірити сайт коледжу
        run: python scripts/bot.py update
      - name: Надіслати в Telegram
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHED: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          MODE="${INPUT_MODE:-watch}"
          if [ "$SCHED" = "15 4 * * 1-5" ]; then MODE=morning; fi
          if [ "$SCHED" = "0 16 * * 0-4" ]; then MODE=evening; fi   # у неділю evening = огляд тижня
          if [ "$SCHED" = "40 7,10,13 * * 1-5" ]; then MODE=watch; fi
          echo "Режим: $MODE"
          python scripts/bot.py notify --mode "$MODE"
      - name: Зберегти зміни в репозиторії
        if: always()
        run: |
          git config user.name "rozklad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "Без змін"; else git commit -m "auto: оновлення розкладу $(TZ=Europe/Kyiv date +'%d.%m %H:%M')" && git push; fi

  pages:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
