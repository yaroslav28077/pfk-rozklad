name: Розклад ПФК

# Щогодини (05:20–21:20 за Києвом взимку, 06:20–22:20 влітку) бот сам вирішує, що робити:
# перевіряє сайт коледжу, розбирає нові PDF, оновлює сайт і розсилає ранок/вечір/заміни.
# GitHub не гарантує час запуску за cron: запуски можуть запізнюватися на години або пропускатися.
# Тому ранкова/вечірня розсилка надсилається в будь-якому запуску в межах вікна (до 13:00 / 23:00),
# дублі відсікає стан у воркері, а про зниклі запуски пише cron самого воркера (див. README).
on:
  schedule:
    - cron: "20 3-19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto — як за розкладом; morning/evening/weekly/announce — примусова розсилка; none — лише оновити сайт"
        type: choice
        options: [auto, morning, evening, weekly, announce, none]
        default: auto
      test_chat:
        description: "Для morning/evening/weekly/announce: chat id тестового чату (тоді примусова розсилка піде ЛИШЕ туди)"
        type: string
        default: ""
      message:
        description: "Текст для announce (порожньо — стандартне повідомлення про відновлення бота)"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "docs/**"
      - "config.json"
      - ".github/workflows/rozklad.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: rozklad
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    outputs:
      deploy: ${{ steps.bot.outputs.deploy }}
      degraded: ${{ steps.bot.outputs.degraded }}
      bot_ok: ${{ steps.bot.outputs.ok }}
      mode: ${{ steps.mode.outputs.mode }}
      site_url: ${{ steps.mode.outputs.site_url }}
    steps:
      # саме гілку, а не коміт події: запізнілий чи перезапущений run має бачити свіжі data/ (інакше — дублі розсилок)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Встановити залежності
        run: pip install -r scripts/requirements.txt

      - name: Режим
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          case "$EVENT" in
            push) MODE=none ;;
            schedule) MODE=auto ;;
            *) MODE="${INPUT_MODE:-auto}" ;;
          esac
          SITE_URL="https://${OWNER,,}.github.io/${REPO_NAME}/"
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "ROZKLAD_STATE=$RUNNER_TEMP/rozklad-state.json" >> "$GITHUB_ENV"
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"
          echo "Режим: $MODE · запуск: $EVENT · $(TZ=Europe/Kyiv date +'%d.%m %H:%M') за Києвом"

      - name: Отримати PDF і зібрати сайт
        id: bot
        run: |
          python scripts/bot.py update --mode "$MODE"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Зберегти стан між джобами
        if: steps.bot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rozklad-state
          path: ${{ runner.temp }}/rozklad-state.json
          retention-days: 1

      - uses: actions/configure-pages@v5
        if: steps.bot.outputs.deploy == 'true' && github.ref_name == 'main'

      - uses: actions/upload-pages-artifact@v4
        if: steps.bot.outputs.deploy == 'true' && github.ref_name == 'main'
        with:
          path: docs

      - name: Зберегти розібрані PDF і стан збоїв (data/)
        if: always() && steps.bot.outcome != 'skipped'
        run: |
          [ -d data ] || { echo "Немає data/"; exit 0; }
          git config user.name "rozklad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -m "auto: оновлення розкладу $(TZ=Europe/Kyiv date +'%d.%m %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Повтор $i…"; sleep 5
          done
          exit 1

  deploy:
    name: Опублікувати сайт
    needs: update
    if: needs.update.outputs.deploy == 'true' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опублікувати сайт
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Розсилки й підсумок
    needs: [update, deploy]
    if: always() && needs.update.outputs.bot_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MODE: ${{ needs.update.outputs.mode }}
      SITE_URL: ${{ needs.update.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Встановити залежності
        run: pip install -r scripts/requirements.txt

      - name: Завантажити стан від update
        uses: actions/download-artifact@v4
        with:
          name: rozklad-state
          path: ${{ runner.temp }}

      # після деплою: нові дані вже на сайті, тож кнопки бота (воркер читає Pages) показують те саме, що й розсилка
      - name: Розсилки й сповіщення адміну
        id: notify
        env:
          TEST_CHAT: ${{ inputs.test_chat }}
          ANNOUNCE_MESSAGE: ${{ inputs.message }}
          PAGES_DEPLOYED: ${{ needs.deploy.result }}
          ROZKLAD_STATE: ${{ runner.temp }}/rozklad-state.json
        run: python scripts/bot.py notify --mode "$MODE" --only "$TEST_CHAT" --message "$ANNOUNCE_MESSAGE"

      - name: Зберегти стан збоїв (data/)
        if: always()
        run: |
          [ -d data ] || { echo "Немає data/"; exit 0; }
          git config user.name "rozklad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -m "auto: оновлення розкладу $(TZ=Europe/Kyiv date +'%d.%m %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Повтор $i…"; sleep 5
          done
          exit 1

      # GitHub вимикає cron-workflow після 60 днів без комітів — вмикаємо його знову щоразу
      - name: Не дати GitHub вимкнути розклад
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPO/actions/workflows/rozklad.yml/enable"

      # збій отримання/розбору не маскується під успіх: сайт і розсилки працюють на останніх даних,
      # але сам запуск позначається як невдалий, з причиною в анотації й підсумку
      - name: Підсумок перевірки
        if: always() && (steps.notify.outputs.degraded == 'true' || needs.update.outputs.degraded == 'true' || needs.deploy.result == 'failure')
        run: |
          if [ "${{ needs.deploy.result }}" = "failure" ]; then
            echo "::error::Не вдалося опублікувати сайт GitHub Pages."
            exit 1
          fi
          echo "::error::Перевірка зі збоями (сайт коледжу / PDF / розбір / воркер) — деталі вище й у Summary. Показано останній робочий розклад."
          exit 1
