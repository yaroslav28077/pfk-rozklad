name: Розклад ПФК

# Щогодини (05:20–21:20 за Києвом взимку, 06:20–22:20 влітку) бот сам вирішує, що робити:
# перевіряє сайт коледжу, розбирає нові PDF, оновлює сайт і розсилає ранок/вечір/заміни.
# GitHub не гарантує час запуску за cron: запуски можуть запізнюватися на години або пропускатися.
# Тому ранкова/вечірня розсилка надсилається в будь-якому запуску в межах вікна (до 13:00 / 23:00),
# дублі відсікає стан у воркері, а про зниклі запуски пише cron самого воркера (див. README).
on:
  schedule:
    - cron: "20 3-19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto — як за розкладом; morning/evening/weekly — примусова розсилка; none — лише оновити сайт"
        type: choice
        options: [auto, morning, evening, weekly, none]
        default: auto
      test_chat:
        description: "Для morning/evening/weekly: chat id тестового чату (тоді примусова розсилка піде ЛИШЕ туди)"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "docs/**"
      - "config.json"
      - ".github/workflows/rozklad.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: rozklad
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      # саме гілку, а не коміт події: запізнілий чи перезапущений run має бачити свіжі data/ (інакше — дублі розсилок)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Встановити залежності
        run: pip install -r scripts/requirements.txt

      - name: Режим
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          case "$EVENT" in
            push) MODE=none ;;
            schedule) MODE=auto ;;
            *) MODE="${INPUT_MODE:-auto}" ;;
          esac
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "ROZKLAD_STATE=$RUNNER_TEMP/rozklad-state.json" >> "$GITHUB_ENV"
          echo "SITE_URL=https://${OWNER,,}.github.io/${REPO_NAME}/" >> "$GITHUB_ENV"
          echo "Режим: $MODE · запуск: $EVENT · $(TZ=Europe/Kyiv date +'%d.%m %H:%M') за Києвом"

      - name: Отримати PDF і зібрати сайт
        id: bot
        run: python scripts/bot.py update --mode "$MODE"

      - uses: actions/configure-pages@v5
        if: steps.bot.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.bot.outputs.deploy == 'true'
        with:
          path: docs

      - name: Опублікувати сайт
        id: deploy
        if: steps.bot.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4

      # після деплою: нові дані вже на сайті, тож кнопки бота (воркер читає Pages) показують те саме, що й розсилка
      - name: Розсилки й сповіщення адміну
        id: notify
        if: always() && steps.bot.outcome == 'success'
        env:
          TEST_CHAT: ${{ inputs.test_chat }}
          PAGES_DEPLOYED: ${{ steps.deploy.outcome }}
        run: python scripts/bot.py notify --mode "$MODE" --only "$TEST_CHAT"

      - name: Зберегти розібрані PDF і стан збоїв (data/)
        if: always() && steps.bot.outcome != 'skipped'
        run: |
          [ -d data ] || { echo "Немає data/"; exit 0; }
          git config user.name "rozklad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -m "auto: оновлення розкладу $(TZ=Europe/Kyiv date +'%d.%m %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Повтор $i…"; sleep 5
          done
          exit 1

      # GitHub вимикає cron-workflow після 60 днів без комітів — вмикаємо його знову щоразу
      - name: Не дати GitHub вимкнути розклад
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPO/actions/workflows/rozklad.yml/enable"

      # збій отримання/розбору не маскується під успіх: сайт і розсилки працюють на останніх даних,
      # але сам запуск позначається як невдалий, з причиною в анотації й підсумку
      - name: Підсумок перевірки
        if: always() && steps.bot.outcome == 'success'
        env:
          DEGRADED: ${{ steps.notify.outputs.degraded || steps.bot.outputs.degraded }}
        run: |
          if [ "$DEGRADED" = "true" ]; then
            echo "::error::Перевірка зі збоями (сайт коледжу / PDF / розбір / воркер) — деталі вище й у Summary. Показано останній робочий розклад."
            exit 1
          fi
          echo "Усе гаразд"
