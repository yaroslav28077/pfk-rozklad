name: Telegram-бот (Cloudflare Worker)

# Розгортає worker/worker.js на Cloudflare, створює KV для підписників і підключає вебхук бота.
# Потрібні секрети: TELEGRAM_BOT_TOKEN, CLOUDFLARE_API_TOKEN (шаблон «Edit Cloudflare Workers»),
# за потреби CLOUDFLARE_ACCOUNT_ID (якщо в токена доступ до кількох акаунтів).
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.json"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF: https://api.cloudflare.com/client/v4
      KV_TITLE: pfk-rozklad-users
    steps:
      - name: Перевірити секрети
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::Немає секрету CLOUDFLARE_API_TOKEN або TELEGRAM_BOT_TOKEN — воркер не розгорнуто. Розсилки працюють і без нього (у TELEGRAM_CHAT_ID). Див. README."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: "22"

      - name: Акаунт і KV для підписників
        if: steps.check.outputs.ok == 'true'
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          ACC="$CF_ACCOUNT"
          if [ -z "$ACC" ]; then
            ACC=$(api "$CF/accounts?per_page=50" | jq -r '.result[0].id // empty')
            [ -n "$ACC" ] || { echo "::error::Не вдалося визначити акаунт Cloudflare — додай секрет CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
          KV=$(api "$CF/accounts/$ACC/storage/kv/namespaces?per_page=100" | jq -r --arg t "$KV_TITLE" '.result[] | select(.title == $t) | .id' | head -n1)
          if [ -z "$KV" ]; then
            KV=$(api -X POST "$CF/accounts/$ACC/storage/kv/namespaces" -d "$(jq -nc --arg t "$KV_TITLE" '{title: $t}')" | jq -r '.result.id')
            echo "Створено KV $KV_TITLE"
          fi
          [ -n "$KV" ] && [ "$KV" != "null" ] || { echo "::error::Не вдалося знайти чи створити KV"; exit 1; }
          jq --arg id "$KV" '.kv_namespaces = [{binding: "USERS", id: $id}]' wrangler.json > wrangler.tmp && mv wrangler.tmp wrangler.json
          echo "KV: $KV"

      - name: Розгорнути воркер
        if: steps.check.outputs.ok == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          SITE_URL="https://${OWNER,,}.github.io/${REPO_NAME}/"
          npx --yes wrangler@4 deploy --var "SITE_URL:$SITE_URL" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n1 || true)
          [ -n "$URL" ] || { echo "::error::Не знайдено адресу *.workers.dev у виводі wrangler. Відкрий у Cloudflare «Workers & Pages» один раз, щоб створити піддомен workers.dev, і запусти ще раз."; exit 1; }
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"
          echo "Воркер: $URL"

      - name: Передати токен бота воркеру
        if: steps.check.outputs.ok == 'true'
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/secrets.json"
          jq -n --arg t "$TELEGRAM_BOT_TOKEN" '{BOT_TOKEN: $t}' > "$F"
          npx --yes wrangler@4 secret bulk "$F"
          rm -f "$F"

      - name: Підключити вебхук Telegram
        if: steps.check.outputs.ok == 'true'
        run: |
          set -euo pipefail
          SECRET=$(printf 'pfk-rozklad:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          echo "::add-mask::$SECRET"
          BODY=$(jq -nc --arg url "$WORKER_URL" --arg s "$SECRET" \
            '{url: $url, secret_token: $s, allowed_updates: ["message", "callback_query", "my_chat_member"], drop_pending_updates: false}')
          R=$(curl -sS -X POST -H "Content-Type: application/json" -d "$BODY" "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook")
          echo "$R" | jq '{ok, description}'
          [ "$(echo "$R" | jq -r .ok)" = "true" ] || exit 1
          ME=$(curl -sS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getMe" | jq -r '.result.username // empty')
          echo "### ✅ Бот підключено" >> "$GITHUB_STEP_SUMMARY"
          echo "Воркер: $WORKER_URL · бот: https://t.me/$ME" >> "$GITHUB_STEP_SUMMARY"
